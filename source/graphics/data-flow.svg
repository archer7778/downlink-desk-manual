<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <title id="t">Downlink Desk data flow</title>
  <desc id="d">SatNOGS stations upload frames to the SatNOGS database. The fetch job collects and decodes them and stores them in a local database, with NOAA space weather. The web console reads the database; phone alerts go out through ntfy.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/></marker>
  </defs>
  <style>
    .box{fill:#f4f6f8;stroke:#4a5560;stroke-width:1.2}
    .srv{fill:#e8f0f7;stroke:#1f5f8b;stroke-width:1.4}
    .lbl{fill:#1d1d1b;font-weight:600}
    .sub{fill:#5e5c57;font-size:11.5px}
    .ln{stroke:#4a5560;stroke-width:1.3;fill:none;marker-end:url(#a)}
    .zone{fill:none;stroke:#1f5f8b;stroke-dasharray:5 4;stroke-width:1}
    .zl{fill:#1f5f8b;font-size:11.5px;font-weight:600}
  </style>
  <rect class="zone" x="228" y="16" width="476" height="268" rx="8"/>
  <text class="zl" x="240" y="34">DOWNLINK DESK SERVER</text>

  <rect class="box" x="16" y="60" width="180" height="56" rx="6"/>
  <text class="lbl" x="28" y="84">SatNOGS stations</text>
  <text class="sub" x="28" y="102">Volunteers hear the satellite</text>

  <rect class="box" x="16" y="150" width="180" height="56" rx="6"/>
  <text class="lbl" x="28" y="174">SatNOGS database</text>
  <text class="sub" x="28" y="192">Stores uploaded frames</text>

  <rect class="box" x="16" y="232" width="180" height="48" rx="6"/>
  <text class="lbl" x="28" y="253">NOAA space weather</text>
  <text class="sub" x="28" y="269">Storms, flares, solar flux</text>

  <rect class="srv" x="250" y="150" width="150" height="56" rx="6"/>
  <text class="lbl" x="262" y="174">Fetch job</text>
  <text class="sub" x="262" y="192">Every 30 min; decodes</text>

  <rect class="srv" x="430" y="150" width="110" height="56" rx="6"/>
  <text class="lbl" x="442" y="174">Database</text>
  <text class="sub" x="442" y="192">SQLite</text>

  <rect class="srv" x="570" y="150" width="124" height="56" rx="6"/>
  <text class="lbl" x="582" y="174">Web console</text>
  <text class="sub" x="582" y="192">Port 8080</text>

  <rect class="box" x="430" y="60" width="110" height="48" rx="6"/>
  <text class="lbl" x="442" y="81">ntfy</text>
  <text class="sub" x="442" y="97">Phone alerts</text>

  <rect class="box" x="570" y="236" width="124" height="40" rx="6"/>
  <text class="lbl" x="582" y="261">Operators</text>

  <path class="ln" d="M106,116 V148"/>
  <path class="ln" d="M196,178 H248"/>
  <path class="ln" d="M196,256 H325 V208"/>
  <path class="ln" d="M400,178 H428"/>
  <path class="ln" d="M540,178 H568"/>
  <path class="ln" d="M325,150 V84 H428"/>
  <path class="ln" d="M632,206 V234"/>
</svg>
